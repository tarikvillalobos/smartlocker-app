name: SmartLocker
options:
  bundleIdPrefix: app.smartlocker
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.smartlocker.demo
    SMARTLOCKER_API_BASE_URL: ""
    SMARTLOCKER_APP_NAME: SmartLocker
    SMARTLOCKER_TERMS_VERSION: ""
    SWIFT_VERSION: "5.0"
    PRODUCT_MODULE_NAME: SmartLockerHost
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework SmartLocker"
targets:
  SmartLocker:
    type: application
    platform: iOS
    sources:
      - SmartLockerApp.swift
      - GeneratedAssets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 2
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(SMARTLOCKER_APP_NAME)"
        INFOPLIST_KEY_SmartLockerApiBaseUrl: "$(SMARTLOCKER_API_BASE_URL)"
        INFOPLIST_KEY_SmartLockerTermsVersion: "$(SMARTLOCKER_TERMS_VERSION)"
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    preBuildScripts:
      - name: Compile shared Compose framework
        script: |
          cd "$SRCROOT/.."
          python3 scripts/prepare_resources.py
          python3 scripts/prepare_icons.py
          ./gradlew :app:embedAndSignAppleFrameworkForXcode --console=plain
        basedOnDependencyAnalysis: false
  SmartLockerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SmartLockerUITests.swift
    dependencies:
      - target: SmartLocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.smartlocker.tests
        PRODUCT_MODULE_NAME: SmartLockerUITests
        GENERATE_INFOPLIST_FILE: YES
  SmartLockerVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmartLockerVaultTests.swift
    dependencies:
      - target: SmartLocker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.smartlocker.vaulttests
        PRODUCT_MODULE_NAME: SmartLockerVaultTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SmartLocker:
    build:
      targets:
        SmartLocker: all
    test:
      targets:
        - SmartLockerUITests
        - SmartLockerVaultTests
