name: SmartLocker
options:
  bundleIdPrefix: app.smartlocker
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: app.smartlocker.demo
    SWIFT_VERSION: "5.0"
    PRODUCT_MODULE_NAME: SmartLockerHost
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework SmartLocker"
targets:
  SmartLocker:
    type: application
    platform: iOS
    sources:
      - SmartLockerApp.swift
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SmartLocker
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    preBuildScripts:
      - name: Compile shared Compose framework
        script: |
          cd "$SRCROOT/.."
          python3 scripts/prepare_resources.py
          ./gradlew :app:embedAndSignAppleFrameworkForXcode --console=plain
        basedOnDependencyAnalysis: false
