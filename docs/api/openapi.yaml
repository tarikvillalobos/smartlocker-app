        - "phone"
        - "phoneVerifiedAt"
        - "email"
        - "emailVerifiedAt"
        - "preferences"
        - "memberships"
    ContactChangeRequest:
      type: "object"
      properties:
        contact:
          type: "string"
          minLength: 3
          maxLength: 254
