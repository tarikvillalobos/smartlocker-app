openapi: "3.1.1"
jsonSchemaDialect: "https://json-schema.org/draft/2020-12/schema"
info:
  title: "SmartLocker App — contrato proposto"
  version: "0.1.0-draft"
  description: |-
    MINUTA PROPOSTA: não descreve uma API existente, publicada ou integrada.
    Documento de base para implementação e revisão conjunta do aplicativo e do futuro fornecedor.
    Nenhum servidor, adaptador HTTP ou integração com hardware acompanha este contrato.

    O servidor deverá isolar marca, usuário e vínculo em cada operação; conhecer um ID não autoriza acesso.
    X-Brand-Id identifica a distribuição white-label e não é segredo nem prova de autorização.
    Tokens são vinculados à marca. Destinatários da mesma unidade não compartilham encomendas por padrão.
    IDs são opacos. Datas usam RFC 3339 UTC com sufixo Z; a interface converte para o fuso do vínculo.
    Respostas pessoais, tokens e credenciais usam Cache-Control: no-store. O app não registra esses corpos.

    x-required-permission documenta autorização de aplicação, não scopes OAuth nem autorização por feature flag.
    Cada permissão deve ser concedida pelo servidor e novamente limitada ao usuário e ao vínculo solicitado.
    CPF identifica a conta e nunca substitui o código temporário como fator de autenticação.
    Erros públicos de login não revelam se um contato ou CPF está cadastrado.

    Mutações POST/PATCH/DELETE descritas com Idempotency-Key exigem uma UUID aleatória por intenção do usuário.
    O servidor guarda o resultado por 24 horas, no escopo marca+sujeito+operação+caminho+chave.
    Antes da autenticação, a chave é isolada por marca+operação+caminho; o corpo não integra a chave.
    O hash do corpo é comparado ao registro existente: conteúdo diferente com a mesma chave retorna 409.
    Não registrar CPF, contato, OTP ou conteúdo de tokens para implementar esta comparação.
    A mesma chave e corpo devolvem o resultado original; conteúdo diferente retorna 409 IDEMPOTENCY_CONFLICT.
    Uma operação ainda em execução retorna 409 OPERATION_IN_PROGRESS com Retry-After; não cria outra operação.
    A reprodução de resposta é avaliada antes de If-Match. O app não repete automaticamente operações mutáveis.
    Reproduzir SessionTokens nunca prolonga prazos, reemite tokens nem reativa sessão ou família.
    Se os tokens registrados expiraram, foram revogados ou substituídos, retornar 401 sem reproduzir segredos.
    Essa recusa de reprodução não revoga por si só uma rotação mais recente ainda válida.
    Registros de idempotência com tokens exigem criptografia em repouso, acesso restrito e nenhum log de segredos.
    Eliminar material secreto ao revogar/expirar a sessão e ao vencer o TTL; manter só metadados não sensíveis
    necessários.
    Reenvio decidido pelo usuário após resposta incerta reutiliza a chave; uma nova intenção gera outra chave.

    Confirmação física só aparece em consultas após processamento do evento confiável do locker pelo servidor.
    Não há endpoint do aplicativo para declarar confirmação física, depositar encomendas ou abrir portas.
    SMS, e-mail, WhatsApp e push são responsabilidades do backend e dependem das capacidades retornadas.
    Configurações, fornecedores, limites e prazos desta minuta precisam ser homologados antes da distribuição.
  license:
    name: "Privado e proprietário"
servers:
  -
    url: "https://api.smartlocker.example.invalid/v1"
    description: "Placeholder deliberadamente não operacional. Substituir por homologação aprovada."
security:
  -
    SessionBearer: []
tags:
  -
    name: "Configuration"
    description: "Capacidades públicas da distribuição white-label."
  -
    name: "Authentication"
    description: "Códigos temporários, renovação e encerramento de sessão."
  -
    name: "Profile"
    description: "Identidade, vínculos, preferências e contatos verificados."
  -
    name: "Parcels"
    description: "Consulta, credencial autorizada e marcação manual de retirada."
  -
    name: "Notifications"
    description: "Avisos de entrega e leitura autenticada."
  -
    name: "Support"
    description: "Relatos vinculados às encomendas autorizadas."
  -
    name: "Devices"
    description: "Registro opcional do dispositivo para notificações push."
paths:
  "/configuration":
    get:
      operationId: "getBrandConfiguration"
      tags:
        - "Configuration"
      summary: "Consultar capacidades públicas da marca"
      security: []
      parameters:
        -
          $ref: "#/components/parameters/BrandId"
      responses:
        "200":
          description: "Resultado confirmado pelo servidor."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/BrandConfiguration"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/auth/challenges":
    post:
      operationId: "requestLoginChallenge"
      tags:
        - "Authentication"
      summary: "Solicitar código de login"
      description: |-
        Sempre responder de forma equivalente para contas existentes e inexistentes. A aceitação não confirma entrega
        do canal. Aplicar limites por contato, CPF, marca e origem. CPF nunca autentica sozinho.
      security: []
      parameters:
        -
          $ref: "#/components/parameters/BrandId"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "202":
          description: "Resultado confirmado pelo servidor."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Challenge"
        "400":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/auth/challenges/{challengeId}/resend":
    parameters:
      -
        $ref: "#/components/parameters/ChallengeId"
    post:
      operationId: "resendLoginChallenge"
      tags:
        - "Authentication"
      summary: "Reenviar código de login"
      description: |-
        Respeitar resendAt. O servidor reenviará ao contato original; retorna novo desafio e invalida o anterior.
        Reenviar não remove limites globais contra abuso.
      security: []
      parameters:
        -
          $ref: "#/components/parameters/BrandId"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: "Resultado confirmado pelo servidor."
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Challenge"
        "400":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "410":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  "/auth/challenges/{challengeId}/verify":
    parameters:
      -
        $ref: "#/components/parameters/ChallengeId"
    post:
      operationId: "verifyLoginChallenge"
      tags:
        - "Authentication"
      summary: "Verificar OTP e criar sessão"
      description: |-
        Consome o desafio de login uma única vez. Código incorreto retorna 422; expirado 410; tentativas esgotadas
        429. Mesma chave reproduz a sessão original por idempotência.
      security: []
      parameters:
        -
          $ref: "#/components/parameters/BrandId"
        -
          $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
