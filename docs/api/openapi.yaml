        -
          parcelId: "parcel-example"
          message: "A porta indicada não abriu durante a retirada."
    SupportIssue:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        reference:
          type: "string"
          maxLength: 100
        membershipId:
          $ref: "#/components/schemas/Identifier"
        parcelId:
          $ref: "#/components/schemas/Identifier"
        message:
          type: "string"
          minLength: 10
          maxLength: 2000
        status:
          type: "string"
          enum:
            - "received"
            - "in_progress"
            - "resolved"
            - "closed"
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
        resolution:
          type:
            - "string"
            - "null"
          maxLength: 2000
      required:
        - "id"
        - "reference"
        - "membershipId"
        - "parcelId"
        - "message"
        - "status"
        - "createdAt"
        - "updatedAt"
        - "resolution"
    IssuePage:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/SupportIssue"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
      required:
        - "items"
        - "pageInfo"
    PushRegistrationRequest:
      type: "object"
      properties:
        platform:
          type: "string"
          enum:
            - "android"
            - "ios"
        provider:
          type: "string"
          enum:
            - "fcm"
            - "apns"
        token:
          $ref: "#/components/schemas/Secret"
          writeOnly: true
        permission:
          type: "string"
          enum:
            - "authorized"
            - "provisional"
        appVersion:
          type: "string"
          minLength: 1
          maxLength: 50
      required:
        - "platform"
        - "provider"
        - "token"
        - "permission"
        - "appVersion"
      additionalProperties: false
      description: |-
        Proposta opcional: android usa fcm; ios usa apns. O backend conhece projeto/ambiente pela distribuição. Nunca
        aceitar credenciais de fornecedor do aplicativo. Desativação ou troca de conta exige remoção do registro.
      oneOf:
        -
          properties:
            platform:
              const: "android"
            provider:
              const: "fcm"
        -
          properties:
            platform:
              const: "ios"
            provider:
              const: "apns"
    PushRegistration:
      type: "object"
      properties:
        installationId:
          type: "string"
          format: "uuid"
        registeredAt:
          $ref: "#/components/schemas/Instant"
      required:
        - "installationId"
        - "registeredAt"
    PushData:
      type: "object"
      properties:
        type:
          type: "string"
          const: "parcel_update"
        brandId:
          $ref: "#/components/schemas/Identifier"
        membershipId:
          $ref: "#/components/schemas/Identifier"
        parcelId:
          $ref: "#/components/schemas/Identifier"
        noticeId:
          $ref: "#/components/schemas/Identifier"
      required:
        - "type"
        - "brandId"
        - "membershipId"
        - "parcelId"
        - "noticeId"
      description: |-
        Envelope de dados proposto para o push. Não contém tokens de sessão, credenciais de retirada, CPF ou contatos.
        O app consulta a API após autenticar e revalidar o vínculo; um push jamais autoriza nem confirma retirada.
    FieldError:
      type: "object"
      properties:
        field:
          type: "string"
          maxLength: 100
        code:
          type: "string"
          maxLength: 100
      required:
        - "field"
        - "code"
    Problem:
      type: "object"
      properties:
        type:
          type: "string"
          format: "uri-reference"
          default: "about:blank"
        title:
          type: "string"
          maxLength: 200
        status:
          type: "integer"
          minimum: 400
          maximum: 599
        code:
          type: "string"
          enum:
            - "VALIDATION_ERROR"
            - "INVALID_OTP"
            - "OTP_EXPIRED"
            - "OTP_ATTEMPTS_EXCEEDED"
            - "RESEND_TOO_EARLY"
            - "SESSION_EXPIRED"
            - "REFRESH_REVOKED"
            - "ACCESS_DENIED"
            - "RESOURCE_NOT_FOUND"
            - "FEATURE_UNAVAILABLE"
            - "CREDENTIAL_EXPIRED"
            - "CREDENTIAL_REVOKED"
            - "CREDENTIAL_CONSUMED"
            - "LOCKER_UNAVAILABLE"
            - "CURSOR_EXPIRED"
            - "PARCEL_ALREADY_COLLECTED"
            - "MANUAL_PICKUP_NOT_REVERSIBLE"
            - "VERSION_CONFLICT"
            - "IDEMPOTENCY_CONFLICT"
            - "OPERATION_IN_PROGRESS"
            - "RATE_LIMITED"
            - "SERVICE_UNAVAILABLE"
            - "INTERNAL_ERROR"
        detail:
          type: "string"
          maxLength: 500
          description: "Mensagem segura sem dados pessoais, códigos, tokens ou detalhes internos."
        instance:
          type: "string"
          format: "uri-reference"
          description: "Identificador da ocorrência, sem dados pessoais."
        requestId:
          type: "string"
          maxLength: 128
        fieldErrors:
          type: "array"
          items:
            $ref: "#/components/schemas/FieldError"
        retryAt:
          $ref: "#/components/schemas/Instant"
      required:
        - "type"
        - "title"
        - "status"
        - "code"
        - "requestId"
      description: |-
        RFC 9457 application/problem+json. O app decide texto e ação pelo code; HTTP status deve coincidir com status.
        401=session/refresh; 403=permissão ou recurso desabilitado; 404=recurso inexistente ou de outro usuário;
        409=estado/idempotência; 410=OTP/cursor/credencial sem validade; 412=versão; 422=validação/OTP inválido;
        429=limite de tentativas/reenvio; 503=indisponibilidade. Nunca distinguir recursos de outros usuários.
