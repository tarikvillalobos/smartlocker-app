        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    SessionBearer:
      type: "http"
      scheme: "bearer"
      bearerFormat: "opaque"
      description: "Access token opaco retornado por login/refresh; transportar somente por HTTPS."
  parameters:
    BrandId:
      name: "X-Brand-Id"
      in: "header"
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
      description: "Identificador público da distribuição. Deve corresponder à marca da sessão/desafio."
    MembershipId:
      name: "membershipId"
      in: "path"
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ParcelId:
      name: "parcelId"
      in: "path"
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    ChallengeId:
      name: "challengeId"
      in: "path"
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    NoticeId:
      name: "noticeId"
      in: "path"
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    IssueId:
      name: "issueId"
      in: "path"
      required: true
      schema:
        $ref: "#/components/schemas/Identifier"
    InstallationId:
      name: "installationId"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "UUID aleatória por instalação; não usar identificador de hardware ou publicidade."
    InstallationKey:
      name: "X-Installation-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_-]{43}$"
      description: |-
        Segredo aleatório de 32 bytes (base64url sem padding) por instalação/marca, gerado por CSPRNG e guardado no
        cofre. Primeiro registro vincula seu hash à instalação; todo PUT/DELETE posterior exige a mesma prova de
        posse. Logout remove destinatário/token push, mas não permite sobrescrever essa prova só por conhecer
        installationId. Nunca registrar esta chave em logs ou utilizá-la como autenticação da conta.
    IdempotencyKey:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema:
        type: "string"
        format: "uuid"
      description: "UUID por intenção, preservada somente ao repetir uma operação de resultado incerto. Ver regras gerais."
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema:
        type: "string"
        pattern: "^\"[0-9]+\"$"
      description: "ETag forte da versão consultada, como \"3\". Previne aplicação sobre estado alterado; conflito retorna 412."
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      schema:
        type: "string"
        minLength: 1
        maxLength: 2048
      description: "Omitir na primeira página. Reutilizar os demais parâmetros do snapshot."
    Limit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 100
        default: 20
    ParcelFilter:
      name: "status"
      in: "query"
      schema:
        type: "string"
        enum:
          - "all"
          - "waiting"
          - "collected"
        default: "all"
      description: "collected inclui manual e físico, sempre distinguíveis no status de cada item."
    Since:
      name: "since"
      in: "query"
      schema:
        $ref: "#/components/schemas/Instant"
      description: "Início inclusivo. Informar junto de until; se ambos omitidos, últimos 30 dias pelo relógio do servidor."
    Until:
      name: "until"
      in: "query"
      schema:
        $ref: "#/components/schemas/Instant"
      description: "Fim exclusivo. Exige since < until, até o instante atual e intervalo máximo de 366 dias."
  headers:
    RequestId:
      description: "Identificador de correlação não sensível."
      schema:
        type: "string"
        maxLength: 128
    NoStore:
      description: "Proíbe armazenamento HTTP de dados pessoais ou credenciais."
      schema:
        type: "string"
        const: "no-store"
    RetryAfter:
      description: "Segundos mínimos até a próxima tentativa; presente em 429 e operações em andamento."
      schema:
        type: "integer"
        minimum: 0
    ETag:
      description: "Versão forte da encomenda para If-Match."
      schema:
        type: "string"
        pattern: "^\"[0-9]+\"$"
  responses:
    Problem:
      description: "Erro estruturado seguro; status HTTP e code determinam a ação permitida."
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: "Sessão ausente/expirada/revogada ou refresh inválido. Reautenticar quando a renovação falhar."
      headers:
        WWW-Authenticate:
          schema:
            type: "string"
          description: "Desafio Bearer sem dados pessoais."
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Identifier:
      type: "string"
      minLength: 1
      maxLength: 128
      pattern: "^[A-Za-z0-9_-]+$"
      description: "Identificador opaco. O app não extrai dados pessoais nem autorização deste valor."
    Instant:
      type: "string"
      format: "date-time"
      pattern: "Z$"
      examples:
        - "2026-09-26T12:00:00.000Z"
      description: "Instante RFC 3339 em UTC; resolução mínima de milissegundos quando disponível."
    Secret:
      type: "string"
      minLength: 1
      maxLength: 8192
      description: "Segredo: não registrar em logs, métricas, URLs ou cache não seguro."
    Challenge:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        expiresAt:
          $ref: "#/components/schemas/Instant"
        resendAt:
          $ref: "#/components/schemas/Instant"
        channel:
          type: "string"
          enum:
            - "sms"
            - "email"
        maskedDestination:
          type: "string"
          maxLength: 254
        codeLength:
          type: "integer"
          const: 6
        purpose:
          type: "string"
          enum:
            - "login"
            - "contact_change"
      required:
        - "id"
        - "expiresAt"
        - "resendAt"
        - "channel"
        - "maskedDestination"
        - "codeLength"
        - "purpose"
      description: "Expiração e reenvio são definidos pelo servidor. Novo envio invalida o OTP anterior. Não devolver o OTP."
      examples:
        -
          id: "challenge-example"
          expiresAt: "2026-09-26T12:05:00.000Z"
          resendAt: "2026-09-26T12:00:30.000Z"
          channel: "sms"
          maskedDestination: "+55 ** *****-4321"
          codeLength: 6
          purpose: "login"
    LoginRequest:
      type: "object"
      properties:
        contact:
          type: "string"
          minLength: 3
          maxLength: 254
          description: "Celular brasileiro em E.164 (+55...) para sms, endereço de e-mail para email."
        cpf:
          type: "string"
          pattern: "^(?!([0-9])\\1{10})[0-9]{11}$"
          description: "Somente os onze dígitos; validar dígitos verificadores. Nunca usar como segredo."
        channel:
          type: "string"
          enum:
            - "sms"
            - "email"
      required:
        - "contact"
        - "cpf"
        - "channel"
      additionalProperties: false
      allOf:
        -
          if:
            properties:
              channel:
                const: "sms"
          then:
            properties:
              contact:
                pattern: "^\\+55[1-9][0-9]9[0-9]{8}$"
          else:
            properties:
              contact:
                format: "email"
                pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
      examples:
        -
          contact: "+5511987654321"
          cpf: "52998224725"
          channel: "sms"
        -
          contact: "ana@example.test"
          cpf: "52998224725"
          channel: "email"
