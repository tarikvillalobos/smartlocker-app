    ParcelActions:
      type: "object"
      properties:
        canMarkManually:
          type: "boolean"
        canUndoManual:
          type: "boolean"
        undoUntil:
          anyOf:
            -
              $ref: "#/components/schemas/Instant"
            -
              type: "null"
        canReportIssue:
          type: "boolean"
      required:
        - "canMarkManually"
        - "canUndoManual"
        - "undoUntil"
        - "canReportIssue"
      description: "Decisão do servidor válida no instante da resposta. O servidor revalida cada comando."
    TimelineEvent:
      type: "object"
      properties:
        type:
          type: "string"
          enum:
            - "deposited"
            - "notification_available"
            - "manual_pickup"
            - "manual_pickup_reverted"
            - "physical_pickup"
        at:
          $ref: "#/components/schemas/Instant"
      required:
        - "type"
        - "at"
    Parcel:
      type: "object"
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        recipientId:
          $ref: "#/components/schemas/Identifier"
        membershipId:
          $ref: "#/components/schemas/Identifier"
        carrier:
          type: "string"
          minLength: 1
          maxLength: 200
        tracking:
          type:
            - "string"
            - "null"
          maxLength: 200
        status:
          type: "string"
          enum:
            - "waiting"
            - "manual"
            - "collected"
        locker:
          $ref: "#/components/schemas/Locker"
        compartment:
          type: "string"
          minLength: 1
          maxLength: 100
        size:
          type:
            - "string"
            - "null"
          maxLength: 50
        depositedAt:
          $ref: "#/components/schemas/Instant"
        notifiedAt:
          anyOf:
            -
              $ref: "#/components/schemas/Instant"
            -
              type: "null"
        deadline:
          $ref: "#/components/schemas/Instant"
        manualAt:
          anyOf:
            -
              $ref: "#/components/schemas/Instant"
            -
              type: "null"
        collectedAt:
          anyOf:
            -
              $ref: "#/components/schemas/Instant"
            -
              type: "null"
        credentialStatus:
          type: "string"
          enum:
            - "active"
            - "expired"
            - "revoked"
            - "consumed"
            - "unverified"
        actions:
          $ref: "#/components/schemas/ParcelActions"
        timeline:
          type: "array"
          items:
            $ref: "#/components/schemas/TimelineEvent"
        version:
          type: "integer"
          minimum: 1
      required:
        - "id"
        - "recipientId"
        - "membershipId"
        - "carrier"
        - "tracking"
        - "status"
        - "locker"
        - "compartment"
        - "size"
        - "depositedAt"
        - "notifiedAt"
        - "deadline"
        - "manualAt"
        - "collectedAt"
        - "credentialStatus"
        - "actions"
        - "timeline"
        - "version"
      description: |-
        collected exige collectedAt de evento físico confiável; manual exige manualAt e collectedAt nulo. waiting
        possui ambos nulos. Credencial nunca aparece nesta representação. Prazo vencido não implica retirada.
      allOf:
        -
          if:
            properties:
              status:
                const: "waiting"
          then:
            properties:
              manualAt:
                type: "null"
              collectedAt:
                type: "null"
        -
          if:
            properties:
              status:
                const: "manual"
          then:
            properties:
              manualAt:
                $ref: "#/components/schemas/Instant"
              collectedAt:
                type: "null"
              credentialStatus:
                const: "revoked"
        -
          if:
            properties:
              status:
                const: "collected"
          then:
            properties:
              collectedAt:
                $ref: "#/components/schemas/Instant"
              credentialStatus:
                const: "consumed"
    PageInfo:
      type: "object"
      properties:
        nextCursor:
          type:
            - "string"
            - "null"
          maxLength: 2048
        snapshotAt:
          $ref: "#/components/schemas/Instant"
        snapshotExpiresAt:
          $ref: "#/components/schemas/Instant"
      required:
        - "nextCursor"
        - "snapshotAt"
        - "snapshotExpiresAt"
      description: |-
        Cursor opaco vinculado ao usuário, marca, vínculo, filtro, ordenação e snapshot. Uma página não é um total
        global. Cursor expirado retorna 410 CURSOR_EXPIRED; reiniciar a primeira página.
    ParcelPage:
      type: "object"
      properties:
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/Parcel"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
      required:
        - "items"
        - "pageInfo"
    ParcelMetrics:
      type: "object"
      properties:
        since:
          $ref: "#/components/schemas/Instant"
        until:
          $ref: "#/components/schemas/Instant"
        generatedAt:
          $ref: "#/components/schemas/Instant"
        complete:
          type: "boolean"
        totalReceived:
          type:
            - "integer"
            - "null"
          minimum: 0
        physicalPickupCount:
          type:
            - "integer"
            - "null"
          minimum: 0
        averagePickupDurationSeconds:
          type:
            - "number"
            - "null"
          minimum: 0
      required:
        - "since"
        - "until"
        - "generatedAt"
        - "complete"
        - "totalReceived"
        - "physicalPickupCount"
        - "averagePickupDurationSeconds"
      description: |-
        Período por depositedAt, inclusivo em since e exclusivo em until. Total de encomendas autorizadas no vínculo.
        Média aritmética collectedAt-depositedAt apenas para retiradas físicas válidas até until, excluindo manuais.
        Sem retiradas físicas: contagem zero e média null. complete=false exige todas as métricas null. Indicadores
        independem do filtro e das páginas da listagem.
      allOf:
        -
          if:
            properties:
              complete:
                const: false
          then:
            properties:
              totalReceived:
                type: "null"
              physicalPickupCount:
                type: "null"
              averagePickupDurationSeconds:
                type: "null"
          else:
            properties:
              totalReceived:
                type: "integer"
              physicalPickupCount:
                type: "integer"
        -
          if:
            properties:
              physicalPickupCount:
                const: 0
          then:
            properties:
              averagePickupDurationSeconds:
                type: "null"
      examples:
        -
          since: "2026-08-27T12:00:00.000Z"
          until: "2026-09-26T12:00:00.000Z"
          generatedAt: "2026-09-26T12:00:00.000Z"
          complete: true
          totalReceived: 8
          physicalPickupCount: 6
          averagePickupDurationSeconds: 9900
    PickupCredential:
      type: "object"
      properties:
        parcelId:
          $ref: "#/components/schemas/Identifier"
        membershipId:
          $ref: "#/components/schemas/Identifier"
        code:
          type: "string"
          pattern: "^[0-9]{4,12}$"
          description: "Código numérico autorizado; preservar zeros iniciais."
        qrPayload:
          type: "string"
          minLength: 1
          maxLength: 2048
          description: "Payload exato autorizado para QR. Nunca montar uma credencial localmente."
        status:
          type: "string"
          const: "active"
        verifiedAt:
          $ref: "#/components/schemas/Instant"
        expiresAt:
          $ref: "#/components/schemas/Instant"
        revalidateAfter:
          $ref: "#/components/schemas/Instant"
      required:
        - "parcelId"
        - "membershipId"
        - "code"
        - "qrPayload"
        - "status"
        - "verifiedAt"
        - "expiresAt"
        - "revalidateAfter"
      description: |-
        Somente credencial ativa e encomenda waiting. verifiedAt <= revalidateAfter <= expiresAt; o app oculta
        código/QR ao atingir revalidateAfter ou perder confirmação de conectividade. O servidor continua sendo fonte
        de autorização no instante da retirada.
    DeliveryNotice:
