name: Verify SmartLocker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 scripts/audit_commits.py
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - run: python scripts/prepare_resources.py
      - if: runner.os == 'Linux'
        run: xvfb-run python3 scripts/gradle.py :core:jvmTest :app:desktopTest
      - if: runner.os != 'Linux'
        run: python scripts/gradle.py :core:jvmTest :app:desktopTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            app/build/reports/
