name: Verify SmartLocker
on: [push, pull_request]
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: python3 scripts/audit_commits.py
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Isolate the supported Android SDK
        shell: bash
        run: |
          python scripts/prepare_android_sdk.py --source "$ANDROID_HOME"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.tools/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.tools/android-sdk" >> "$GITHUB_ENV"
      - run: python scripts/prepare_resources.py
      - if: runner.os == 'Linux'
        run: xvfb-run python3 scripts/gradle.py :core:jvmTest :app:desktopTest
      - if: runner.os != 'Linux'
        run: python scripts/gradle.py :core:jvmTest :app:desktopTest
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Verify the native session vault
        run: python scripts/run_native_secure_tests.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          path: |
            app/build/reports/
            core/build/reports/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Isolate the supported Android SDK
        shell: bash
        run: |
          python scripts/prepare_android_sdk.py --source "$ANDROID_HOME"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.tools/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.tools/android-sdk" >> "$GITHUB_ENV"
      - run: python3 scripts/prepare_resources.py
      - run: ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest :androidApp:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: androidApp/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: brew install xcodegen
      - run: python3 scripts/prepare_resources.py
      - run: python3 scripts/prepare_icons.py
      - run: xcodegen generate --spec iosApp/project.yml
      - run: >-
          xcodebuild -project iosApp/SmartLocker.xcodeproj -scheme SmartLocker
          -sdk iphonesimulator -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
