name: Build installable artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop-packages:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
        brand: [smartlocker, aurora]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Isolate the supported Android SDK
        shell: bash
        run: |
          python scripts/prepare_android_sdk.py --source "$ANDROID_HOME"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.tools/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.tools/android-sdk" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot
      - name: Locate WiX 3 from Windows runner image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candle = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3*\bin\candle.exe" | Select-Object -First 1
          if (!$candle) { throw "WiX 3 candle.exe is required by JDK 21 jpackage" }
          $candle.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python scripts/prepare_resources.py
      - run: python scripts/prepare_icons.py
      - name: Build native installer with bundled Java runtime
        run: python scripts/gradle.py :app:packageDistributionForCurrentOS -Pbrand=${{ matrix.brand }} --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.brand }}-${{ runner.os }}-${{ runner.arch }}-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/compose/binaries/main/dmg/*.dmg
            app/build/compose/binaries/main/msi/*.msi
            app/build/compose/binaries/main/deb/*.deb
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Isolate the supported Android SDK
        shell: bash
        run: |
          python scripts/prepare_android_sdk.py --source "$ANDROID_HOME"
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/.tools/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$GITHUB_WORKSPACE/.tools/android-sdk" >> "$GITHUB_ENV"
      - run: brew install xcodegen
      - run: python scripts/prepare_resources.py
      - run: python scripts/prepare_icons.py
      - run: xcodegen generate --spec iosApp/project.yml
      - name: Build simulator application with local signing
        run: >-
          xcodebuild -project iosApp/SmartLocker.xcodeproj -scheme SmartLocker
          -sdk iphonesimulator -configuration Debug -derivedDataPath artifacts/ios
      - name: Archive simulator app preserving bundle metadata
        run: >-
          ditto -c -k --sequesterRsrc --keepParent
          artifacts/ios/Build/Products/Debug-iphonesimulator/SmartLocker.app
          artifacts/SmartLocker-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: smartlocker-iOS-simulator-arm64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: artifacts/SmartLocker-ios-simulator.zip
